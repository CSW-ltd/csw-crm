# Konteyner ichidagi Nginx: SPA + /api va /socket.io ni backend'ga uzatish.
# Prod: csw-app'dagi edge nginx (TLS, domen) shu konteynerga proksi qiladi (deploy/app).
# Tashqi edge nginx (TLS) X-Forwarded-Proto yuborsa — uni saqlaymiz, aks holda o'z sxemamiz
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # rasm yuklash (backend limiti 10 MB)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /socket.io/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
