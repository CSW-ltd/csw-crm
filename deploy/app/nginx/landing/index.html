<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSW — tez orada</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1d2330; --muted: #5d6677; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12151c; --fg: #e8ebf1; --muted: #9aa3b5; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 16px; }
    main { text-align: center; max-width: 32rem; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
    p { margin: .25rem 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>CSW</h1>
    <p>Sayt tez orada ishga tushadi.</p>
    <p lang="ru">Сайт скоро откроется.</p>
  </main>
</body>
</html>
