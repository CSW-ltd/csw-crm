# Har push (dev, prod, master): backend testlari + frontend typecheck/build.
# dev: + api va web rasmlari GHCR'ga (tag = commit SHA). Rasm faqat bir marta yig'iladi: dev → prod fast-forward,
# shuning uchun prod'ga aynan testda sinalgan rasm chiqadi. Deploy — serverda qo'lda: deploy/deploy.sh <sha>
name: ci

on:
  push:
    branches: [dev, prod, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pipenv==2024.4.0
      - run: pipenv install --dev --deploy
      - run: pipenv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  images:
    if: github.ref == 'refs/heads/dev'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      # GHCR nomi faqat kichik harf: CSW-ltd → csw-ltd (repo ko'chsa ham o'zi moslashadi)
      - name: Rasm nomi
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/csw-crm-${NAME}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
